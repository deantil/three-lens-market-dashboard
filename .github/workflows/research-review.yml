name: Weekly paper strategy review
on:
  push:
    branches: [main]
    paths: ['research_backtest.py', 'tests/**', '.github/workflows/research-review.yml']
  schedule:
    - cron: '0 15 * * 6'
  workflow_dispatch:
  pull_request:
    paths: ['paper_agent.py', 'options_research.py', 'manual_replication.py', 'research_backtest.py', 'tests/**', '.github/workflows/**']
permissions:
  contents: write
concurrency:
  group: daily-paper-challenge
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install requests
      - run: python -m unittest discover -s tests -v
      - name: Restore archive
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin paper-state
          git show FETCH_HEAD:paper_challenge_state.json > paper_challenge_state.json
          if git cat-file -e FETCH_HEAD:research 2>/dev/null; then
            git archive FETCH_HEAD research | tar -x
          fi
      - name: Run historical replay and review
        if: github.event_name != 'pull_request'
        env:
          CHATGPT_APCA_API_KEY_ID: ${{ secrets.CHATGPT_APCA_API_KEY_ID }}
          CHATGPT_APCA_API_SECRET_KEY: ${{ secrets.CHATGPT_APCA_API_SECRET_KEY }}
        run: |
          python research_backtest.py
          cat research/review.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: strategy-review-${{ github.run_id }}
          path: research/
          retention-days: 90
      - name: Publish review
        if: github.event_name != 'pull_request'
        run: |
          cp -r research "$RUNNER_TEMP/strategy-review"
          rm paper_challenge_state.json
          rm -rf research
          git fetch origin paper-state
          git checkout -B paper-state FETCH_HEAD
          mkdir -p research
          cp -r "$RUNNER_TEMP/strategy-review/." research/
          git add research
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Weekly conservative strategy review'
          git push origin paper-state

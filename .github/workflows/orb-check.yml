name: ORB strategy checks
on:
  push:
    branches: [main]
    paths: [orb_strategy.py, orb_dashboard.py, streamlit_app.py, requirements.txt, tests/test_orb.py, tests/test_orb_ui.py, '.github/workflows/orb-check.yml']
  pull_request:
    paths: [orb_strategy.py, orb_dashboard.py, streamlit_app.py, requirements.txt, tests/test_orb.py, tests/test_orb_ui.py, '.github/workflows/orb-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile orb_strategy.py orb_dashboard.py streamlit_app.py

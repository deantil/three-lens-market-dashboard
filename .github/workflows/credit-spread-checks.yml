name: Credit spread scanner checks
on:
  push:
    branches: [main, 'project-t/**']
    paths: ['credit_spread_*.py', 'kotegawa_options_*.py', 'test_kotegawa*.py', 'test_credit_spread*.py', 'streamlit_app.py', 'requirements.txt', '.github/workflows/credit-spread-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest test_credit_spreads test_credit_spread_ui test_credit_spread_success_ui test_kotegawa_options test_kotegawa_options_ui -v
      - name: Connected live stock to options probe
        run: |
          python - <<'PY'
          import json
          from kotegawa_options_scanner import load_stock_snapshot, run_connected_scan
          report=run_connected_scan(load_stock_snapshot(),limit=20)
          with open('kotegawa-options-verification.json','w') as f:
              json.dump(report,f,default=str)
          print('CONNECTED_SCAN_COVERAGE='+json.dumps(report['coverage']))
          print('CONNECTED_SCAN_SETTINGS='+json.dumps(report['settings']))
          print('CONNECTED_SCAN_STOCKS='+json.dumps([s for s in report['stocks'] if 'Direction' in s],default=str))
          PY
      - name: Read-only live data probe
        run: |
          python - <<'PY'
          import json
          from credit_spread_scanner import run_scan
          report = run_scan(['AAPL', 'F', 'SOFI'], 'Both', 3.0, '7–45 DTE')
          print('LIVE_SCAN_REPORT=' + json.dumps(report, default=str))
          with open('credit-scan-verification.json', 'w') as f:
              json.dump(report, f, indent=2, default=str)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credit-scan-verification
          path: |
            credit-scan-verification.json
            kotegawa-options-verification.json


